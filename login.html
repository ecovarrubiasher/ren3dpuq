<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Ren3D — Ingresar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <div class="login-wrap">
    <form id="loginForm" class="login-card">
      <img src="images/logo.png" alt="Ren3D" class="login-logo">
      <h1>Panel Ren3D</h1>
      <label>Contraseña
        <input type="password" id="password" autocomplete="current-password" required autofocus>
      </label>
      <button type="submit" class="btn btn-primary">Ingresar</button>
      <p id="loginMsg" class="admin-msg admin-msg-error" hidden></p>
    </form>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
